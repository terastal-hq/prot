openapi: 3.1.0
info:
  title: prot Control Plane API
  description: Local development service manager and control plane API.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:4400
    description: Authenticated loopback management listener
paths:
  /v1/health:
    get:
      summary: Read daemon health and versions
      responses:
        "200":
          description: Daemon is healthy
  /v1/events:
    get:
      summary: Stream daemon events via Server-Sent Events (SSE)
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream: {}
  /v1/services:
    get:
      summary: List registered and running services
      responses:
        "200":
          description: List of services
    post:
      summary: Register a new managed service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, command]
              properties:
                id: { type: string }
                name: { type: string }
                alias: { type: string }
                command: { type: string }
                args: { type: array, items: { type: string } }
                cwd: { type: string }
                env: { type: object, additionalProperties: { type: string } }
                port: { type: integer }
                auto_port: { type: boolean }
                restart_policy: { type: string, enum: [no, always, on-failure] }
                lan_exposed: { type: boolean }
      responses:
        "201":
          description: Service registered
  /v1/services/{id}:
    get:
      summary: Read service details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Service details }
        "404": { description: Not found }
    patch:
      summary: Update service settings (partial; omitted fields are unchanged)
      description: >
        Alias, name, auto_start and lan_exposed apply immediately. Command, cwd, env, port, auto_port
        and restart_policy are used on the next start.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                alias: { type: string, description: DNS label, lowercase letters/digits/hyphens }
                command: { type: string }
                cwd: { type: string }
                env: { type: object, additionalProperties: { type: string } }
                port: { type: integer, minimum: 0, maximum: 65535 }
                auto_port: { type: boolean }
                auto_start: { type: boolean }
                restart_policy: { type: string, enum: [no, on-failure, always] }
                lan_exposed: { type: boolean }
      responses:
        "200": { description: Updated service }
        "400": { description: Invalid value }
        "404": { description: Not found }
        "409": { description: Alias already used }
    delete:
      summary: Remove service registration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Service deleted }
  /v1/services/{id}/start:
    post:
      summary: Start a managed service
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Service started }
  /v1/services/{id}/stop:
    post:
      summary: Stop a managed service
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Service stopped }
  /v1/services/{id}/restart:
    post:
      summary: Restart a managed service
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Service restarted }
  /v1/services/{id}/logs:
    get:
      summary: Retrieve recent logs or stream live logs
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
        - name: follow
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200": { description: Service logs }
  /v1/discovery:
    get:
      summary: List observed TCP processes and HTTP services
      responses:
        "200": { description: Discovered processes }
  /v1/discovery/{id}/adopt:
    post:
      summary: Adopt an observed service into a managed service
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                alias: { type: string }
                command: { type: string }
      responses:
        "201": { description: Adopted into managed service }
  /v1/routes:
    get:
      summary: List active reverse proxy routes
      responses:
        "200": { description: List of routes }
    post:
      summary: Map an alias to an upstream target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alias, target_url]
              properties:
                alias: { type: string }
                target_url: { type: string }
                lan_exposed: { type: boolean }
      responses:
        "201": { description: Route created }
  /v1/routes/{alias}:
    delete:
      summary: Remove a route
      parameters:
        - name: alias
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Route removed }
  /v1/tunnels:
    get:
      summary: List SSH tunnels
      description: Saved tunnels with their live status. Each carries the .localhost address it is reachable at.
      responses:
        "200": { description: List of tunnels }
    post:
      summary: Register an SSH tunnel
      description: >
        Saves the tunnel and gives its alias a .localhost route. With auto_connect it connects immediately and again
        whenever protd starts. ssh runs non-interactively (BatchMode), so authentication must work without a prompt:
        a key in ssh-agent or an unencrypted key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alias, ssh_host, remote_port]
              properties:
                id: { type: string, description: "Generated when omitted" }
                alias: { type: string, description: "Becomes <alias>.localhost; unique across services and tunnels" }
                ssh_host: { type: string }
                ssh_user: { type: string }
                remote_host: { type: string, default: "127.0.0.1" }
                remote_port: { type: integer }
                local_port: { type: integer, default: 0, description: "0 picks a free port on every connection" }
                identity_file: { type: string }
                extra_args: { type: array, items: { type: string }, description: "Extra ssh arguments, for example -p 2222" }
                auto_connect: { type: boolean }
      responses:
        "201": { description: Tunnel registered }
        "400": { description: Invalid alias or field }
        "409": { description: Alias already used by a service or tunnel }
        "501": { description: ssh is not installed }
  /v1/tunnels/{id}:
    delete:
      summary: Disconnect and delete a tunnel
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "Tunnel id or alias" }
      responses:
        "204": { description: Tunnel removed }
        "404": { description: Unknown tunnel }
  /v1/tunnels/{id}/start:
    post:
      summary: Connect a tunnel
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "Tunnel id or alias" }
      responses:
        "200": { description: Tunnel status }
        "404": { description: Unknown tunnel }
  /v1/tunnels/{id}/stop:
    post:
      summary: Disconnect a tunnel
      description: Returns once the ssh process has exited.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "Tunnel id or alias" }
      responses:
        "200": { description: Tunnel status }
        "404": { description: Unknown tunnel }
