<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 68" width="860" height="68" role="img" aria-label="Testing">
<title>Testing</title>
<defs>
<style>
@font-face{font-family:'Anton';src:url(data:font/woff2;base64,) format('woff2');}
.wa{font-family:Anton,Impact,'Arial Black',sans-serif;font-size:36px;letter-spacing:2px}
</style>
<linearGradient id="face" gradientUnits="userSpaceOnUse" x1="0" y1="-31" x2="0" y2="0">
<stop offset="0" stop-color="#ffd21a"/><stop offset=".45" stop-color="#fb8808"/><stop offset=".55" stop-color="#ff5a00"/><stop offset="1" stop-color="#99e051"/>
</linearGradient>
<pattern id="hazard" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="16" height="16" fill="#050608"/><rect width="8" height="16" fill="#fb8808"/></pattern>
<text id="t" class="wa" x="0" y="0">TESTING</text>
</defs>
<g transform="translate(14 45) rotate(-2) skewX(-6)">
<use href="#t" x="-4" y="4" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/><use href="#t" x="-3" y="3" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/><use href="#t" x="-2" y="2" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/><use href="#t" x="-1" y="1" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
<use href="#t" fill="url(#face)" stroke="#000" stroke-width="1.4" stroke-linejoin="round" paint-order="stroke fill"/>
</g>
<rect x="1" y="55" width="858" height="10" fill="#000"/>
<rect x="3" y="57" width="854" height="6" fill="url(#hazard)"/>
</svg>
