[package]
name = "prot-desktop"
version = "0.2.0"
description = "prot developer service control plane"
edition = "2021"

[lib]
name = "prot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
