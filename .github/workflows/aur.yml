name: Publish to AUR

# Publishes two AUR package bases: prot (builds protd and prot, Go only) and prot-desktop (builds the Tauri app).
# They are separate so that installing prot never compiles the desktop app.
# Called by the Release workflow for every v* tag; also runnable by hand to retry or to re-publish.

on:
  workflow_call:
    inputs:
      version:
        description: "Version without the leading v (defaults to the tag that triggered the run)"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.1.0 (the v<version> tag must already exist)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.base }}
    runs-on: ubuntu-latest
    strategy:
      # One at a time, prot first: the AUR does not let prot-desktop become its own base until the prot base no longer
      # lists it, and a failure in prot should stop prot-desktop from being pushed against a stale prot.
      max-parallel: 1
      matrix:
        include:
          - base: prot
            assets: |
              ./packaging/aur/prot/protd.service
              ./packaging/aur/prot/protd.install
          - base: prot-desktop
            assets: ""
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      PKGBUILD: packaging/aur/${{ matrix.base }}/PKGBUILD
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set package version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          sed -i "s/^pkgver=.*/pkgver=${version}/; s/^pkgrel=.*/pkgrel=1/" "$PKGBUILD"
          grep -n '^pkgver=\|^pkgrel=' "$PKGBUILD"

      - name: Fill in the source checksum
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Done here instead of by the deploy action's updpkgsums, which downloads the tarball into the AUR
          # repository and commits it (the AUR rejects blobs over 488 KiB).
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          sum="$(curl -fsSL "https://github.com/terastal-hq/prot/archive/refs/tags/v${version}.tar.gz" | sha256sum | cut -d' ' -f1)"
          test "${#sum}" = 64
          sed -i "0,/^sha256sums=('SKIP'/s//sha256sums=('${sum}'/" "$PKGBUILD"
          grep -n "^sha256sums" -A2 "$PKGBUILD"

      - name: Publish ${{ matrix.base }} to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: ${{ matrix.base }}
          pkgbuild: ./packaging/aur/${{ matrix.base }}/PKGBUILD
          assets: ${{ matrix.assets }}
          updpkgsums: false
          commit_username: Aditya Gupta
          commit_email: mail@adityagupta.dev
          ssh_private_key: ${{ env.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ inputs.version || github.ref_name }}"

      - name: Skipped (no AUR key)
        if: env.AUR_SSH_PRIVATE_KEY == ''
        run: echo "::warning::AUR_SSH_PRIVATE_KEY is not set; skipping AUR publish."
